<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card-container">
    <h1>Home - Profile</h1>

    <div class="profile-info">
        <div class="info-item">
            <span class="info-label">Username</span>
            <span class="info-value" th:text="${user.username}">admin</span>
        </div>
        <div class="info-item">
            <span class="info-label">Nama</span>
            <span class="info-value" th:text="${profile.nama}">Full Name</span>
        </div>
        <div class="info-item">
            <span class="info-label">Alamat</span>
            <span class="info-value" th:text="${profile.alamat}">Address Info</span>
        </div>
    </div>

    <a th:href="@{/logout}" class="logout-btn">
        Logout
    </a>
</div>
</body>
</html>
